# Minimal window manager for Steam's nested headless display.
font pango:monospace 8
focus_follows_mouse no
default_border none
default_floating_border none
workspace_layout tabbed

# Steam marks its login window as a dialog-sized popup. Force every Steam
# surface to tile across the whole nested display instead.
for_window [class="^steam$"] border pixel 0, floating disable, fullscreen enable
